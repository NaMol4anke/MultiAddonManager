name: NEVA SteamRT3 release
on:
  workflow_dispatch:
  push:
    tags: ['v*-neva.*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/source2ze/build-containers:steamrt3
    steps:
      - uses: actions/checkout@v7
        with:
          path: MultiAddonManager
          submodules: recursive
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: alliedmodders/metamod-source
          ref: master
          path: mmsource-2.0
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: alliedmodders/s2sdk
          ref: 81020d1a26b9d4321b9f030c96929ec18e8c0cff
          path: hl2sdk-cs2
      - name: Verify fixes and build
        working-directory: MultiAddonManager
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ../hl2sdk-cs2 rev-parse HEAD)" = 81020d1a26b9d4321b9f030c96929ec18e8c0cff
          grep -Fq '55 41 B8 ? ? ? ? B9 ? ? ? ? 48 89 E5 41 57' src/multiaddonmanager.cpp
          mkdir build
          cd build
          python ../configure.py --enable-optimize --sdks cs2
          ambuild
          test -s package/addons/metamod/multiaddonmanager.vdf
          test -s package/addons/multiaddonmanager/bin/multiaddonmanager.so
          readelf -h package/addons/multiaddonmanager/bin/multiaddonmanager.so
          readelf -d package/addons/multiaddonmanager/bin/multiaddonmanager.so
          test -z "$(find package -type l -print -quit)"
          cp ../NEVA-HOTFIX.md package/NEVA-HOTFIX.md
          printf 'Source commit: %s\nSDK commit: %s\nMetamod source commit: %s\n' "$GITHUB_SHA" 81020d1a26b9d4321b9f030c96929ec18e8c0cff "$(git -C ../../mmsource-2.0 rev-parse HEAD)" > package/BUILD-PROVENANCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SteamRT3
          path: MultiAddonManager/build/package/
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: SteamRT3
          path: package
      - name: Package and verify
        shell: bash
        run: |
          set -euo pipefail
          asset="MultiAddonManager-${GITHUB_REF_NAME}-steamrt3.tar.gz"
          tar -czf "$asset" -C package .
          tar -tzf "$asset" > archive-contents.txt
          grep -Fxq './addons/metamod/multiaddonmanager.vdf' archive-contents.txt
          grep -Fxq './addons/multiaddonmanager/bin/multiaddonmanager.so' archive-contents.txt
          sha256sum "$asset" > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" MultiAddonManager-*-steamrt3.tar.gz SHA256SUMS.txt --verify-tag --title "MultiAddonManager $GITHUB_REF_NAME — CS2 1.41.9.7 hotfix (SteamRT3)" --notes-file NEVA-HOTFIX.md --latest